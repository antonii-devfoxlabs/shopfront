[project]
name = "shopfront"
version = "1.0.0"
description = "The project of Design Patterns in Practice, Level 1"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
check_untyped_defs = true

[tool.ruff]
line-length = 78
